// Opium
try {
  const dirs = Cc["@mozilla.org/file/directory_service;1"].getService(Ci.nsIProperties);
  const io = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);
  const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
  const gre = dirs.get("GreD", Ci.nsIFile);
  const start = gre.clone();
  start.append("opium-start.html");
  defaultPref("browser.startup.homepage", io.newFileURI(start).spec);
  const css = gre.clone();
  css.append("opium.css");
  const uri = io.newFileURI(css);
  if (!sss.sheetRegistered(uri, sss.USER_SHEET)) {
    sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
  }
} catch (e) {
  Cu.reportError(e);
}
