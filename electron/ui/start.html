<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src file:; img-src file:">
<title>Neuer Tab</title>
<style>
  @font-face { font-family: "JetBrainsMono Nerd Font"; src: url("fonts/JetBrainsMonoNerdFont-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "JetBrainsMono Nerd Font"; src: url("fonts/JetBrainsMonoNerdFont-Medium.ttf"); font-weight: 500; }
  :root { --accent: #a78bfa; --bg: #121016; --text: #e9e7ee; --muted: #8d8999; --faint: #5d5967; --line: rgba(255,255,255,.07); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 "JetBrainsMono Nerd Font", ui-monospace, monospace;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: radial-gradient(80% 60% at 50% 120%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%);
    pointer-events: none;
  }
  canvas { position: fixed; inset: 0; pointer-events: none; }
  main { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; transform: translateY(-4vh); }
  .time { font-size: clamp(44px, 7vw, 72px); font-weight: 400; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .date { margin-top: 10px; color: var(--muted); }
  form { width: min(560px, 100%); margin-top: 36px; position: relative; }
  input {
    width: 100%; height: 46px; padding: 0 16px 0 42px;
    border-radius: 10px; border: 1px solid var(--line);
    background: rgba(255,255,255,.035);
    color: var(--text); font: inherit; outline: none;
    transition: border-color .15s, background .15s;
  }
  input::placeholder { color: var(--faint); }
  input:hover { background: rgba(255,255,255,.05); }
  input:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); background: rgba(255,255,255,.05); }
  form svg { position: absolute; left: 15px; top: 15px; width: 16px; height: 16px; fill: none; stroke: var(--faint); stroke-width: 1.5; stroke-linecap: round; }
  .mark { position: fixed; left: 22px; bottom: 18px; display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 11px; }
  .mark img { width: 14px; height: 14px; opacity: .7; }
</style>
</head>
<body>
<canvas id="snow"></canvas>
<main>
  <div class="time" id="time"></div>
  <div class="date" id="date"></div>
  <form id="search" autocomplete="off">
    <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
    <input name="q" placeholder="Suchen oder Adresse eingeben" autofocus>
  </form>
</main>
<div class="mark"><img src="logo.png" alt="">opium</div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const accent = /^#[0-9a-f]{6}$/i.test(params.get('accent') || '') ? params.get('accent') : '#a78bfa';
  const engine = params.get('engine') || 'https://duckduckgo.com/?q=%s';
  const level = Number(params.get('snow') ?? 2);
  document.documentElement.style.setProperty('--accent', accent);

  const time = document.getElementById('time');
  const date = document.getElementById('date');
  const tick = () => {
    const now = new Date();
    time.textContent = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    date.textContent = now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
  };
  tick();
  setInterval(tick, 5000);

  document.getElementById('search').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = e.target.q.value.trim();
    if (!q) return;
    const isUrl = /^(https?:\/\/)?[^\s]+\.[a-z]{2,}(:\d+)?(\/\S*)?$/i.test(q);
    location.href = isUrl ? (/^https?:/i.test(q) ? q : 'https://' + q) : engine.replace('%s', encodeURIComponent(q));
  });

  const density = { 1: 30000, 2: 16000, 3: 8000 }[level];
  if (!density) return;
  const c = document.getElementById('snow');
  const ctx = c.getContext('2d');
  const dpr = Math.min(devicePixelRatio || 1, 2);
  let w, h, flakes = [];
  const make = (anyY) => {
    const z = Math.random();
    return { x: Math.random() * w, y: anyY ? Math.random() * h : -8, r: 0.5 + z * 1.8, vy: 0.15 + z * 0.55, phase: Math.random() * 6.28, a: 0.2 + z * 0.55 };
  };
  const fit = () => {
    w = innerWidth; h = innerHeight;
    c.width = w * dpr; c.height = h * dpr;
    c.style.width = w + 'px'; c.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round((w * h) / density);
    while (flakes.length < n) flakes.push(make(true));
    flakes.length = n;
  };
  const frame = (t) => {
    ctx.clearRect(0, 0, w, h);
    ctx.shadowColor = accent;
    for (const f of flakes) {
      f.y += f.vy;
      f.x += Math.sin(t / 2600 + f.phase) * 0.2;
      if (f.y > h + 8) Object.assign(f, make(false));
      ctx.shadowBlur = 2 + f.r * 3;
      ctx.fillStyle = `rgba(240,236,255,${f.a})`;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, 6.283);
      ctx.fill();
    }
    requestAnimationFrame(frame);
  };
  addEventListener('resize', fit);
  fit();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
